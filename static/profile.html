<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LS Profile</title>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/nav.css?v=lunar7">
  <link rel="stylesheet" href="/assets/css/lunar.css?v=lunar9">
  <link rel="stylesheet" href="/assets/css/community.css?v=lunar14">
  <script src="/assets/js/storage.js?v=lunar7"></script>
  <script src="/assets/js/main.js?v=lunar7"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/ui-stability.css?v=1">
</head>
<body class="lunar-community-page">
  <div class="nav-bar"></div>
  <main class="account-shell">
    <section class="account-card profile-public-card" id="public-profile-card">
      <div class="profile-public-banner" id="banner"></div>
      <div class="profile-public-body">
        <div class="profile-public-identity">
          <div class="profile-avatar profile-public-avatar" id="avatar"></div>
          <div class="profile-public-heading">
            <div class="profile-public-name">
              <h1 id="name">Loading...</h1>
              <span id="owner" class="profile-owner-badge" hidden>OWNER OF LS</span>
            </div>
            <p class="profile-public-username" id="username"></p>
            <p class="profile-public-status" id="status"></p>
          </div>
        </div>
        <p class="profile-public-bio" id="bio"></p>
        <div class="profile-role-list" id="roles"></div>
        <div class="profile-discord" id="discord" hidden><strong>Discord connected</strong><span id="discordName"></span></div>

        <section class="profile-stickers-section">
          <h2><i class="fa-solid fa-note-sticky"></i> Sticker Catalog <span id="sticker-count-public"></span></h2>
          <div class="profile-public-sticker-grid" id="profile-stickers"></div>
          <p class="profile-public-status" id="no-stickers" hidden>No saved stickers yet.</p>
        </section>

        <a class="profile-back" href="/chat">Back to chat</a>
      </div>
    </section>
  </main>
  <script>
    (async()=>{
      const esc=v=>{const d=document.createElement("div");d.textContent=v||"";return d.innerHTML};
      const n=v=>(v||"?").slice(0,2).toUpperCase();
      const u=decodeURIComponent(location.pathname.split("/").pop()||"");
      try{
        const r=await fetch("/api/users/"+encodeURIComponent(u));
        const d=await r.json();
        if(!r.ok)throw Error(d.error||"Profile not found");
        const x=d.user;
        document.title=(x.displayName||x.username)+" · LS";
        document.getElementById("name").textContent=x.displayName;
        document.getElementById("username").textContent="@"+x.username;
        document.getElementById("status").textContent=x.status||"";
        document.getElementById("bio").textContent=x.bio||"";
        document.getElementById("avatar").innerHTML=x.avatarUrl?'<img src="'+esc(x.avatarUrl)+'" alt="">':esc(n(x.displayName));
        const publicCard=document.getElementById("public-profile-card");
        const safeImageUrl=value=>/^(?:\/uploads\/|\/assets\/|https:\/\/)/i.test(String(value||""))?String(value):"";
        if(x.backgroundUrl){
          const background=safeImageUrl(x.backgroundUrl);
          if(background)publicCard.style.backgroundImage=`linear-gradient(180deg,rgba(10,12,18,.28),rgba(10,12,18,.94) 75%),url("${background}")`;
        }
        if(x.bannerUrl)document.getElementById("banner").style.backgroundImage='url("'+x.bannerUrl+'")';
        document.getElementById("owner").hidden=!x.isOwner;
        document.getElementById("roles").innerHTML=(x.roles||[]).map(z=>'<span class="profile-role '+(z==="Owner"?"owner":"")+'">'+esc(z)+'</span>').join("");
        if(x.discordConnected){
          document.getElementById("discord").hidden=false;
          document.getElementById("discordName").textContent=x.discordUsername||"";
        }
        const stickers=x.stickers||[];
        document.getElementById("sticker-count-public").textContent=stickers.length?" · "+stickers.length:"";
        document.getElementById("no-stickers").hidden=stickers.length>0;
        document.getElementById("profile-stickers").innerHTML=stickers.map(s=>'<div class="profile-public-sticker" title="'+esc(s.name)+'"><img src="'+esc(s.url)+'" alt="'+esc(s.name)+'" loading="lazy"></div>').join("");
      }catch(e){
        document.getElementById("name").textContent="Profile not found";
        document.getElementById("username").textContent=e.message;
      }
    })();
  </script>
</body>
</html>
