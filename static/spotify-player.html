<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Spotify Player · Lunar</title>
  <link rel="stylesheet" href="/assets/css/spotify-global-player.css?v=lunar2">
  <style>html,body{margin:0;min-height:100%;background:#090b10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}.lunar-player-window{min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}.lunar-player-window #lunar-global-spotify-player{position:relative!important;left:auto!important;top:auto!important;right:auto!important;bottom:auto!important;width:min(430px,100%);z-index:1}.lunar-player-window .lunar-global-spotify-foot{display:none}</style>
  <link rel="stylesheet" href="/assets/css/ui-stability.css?v=1">
</head>
<body>
  <div class="lunar-player-window"><div id="lunar-player-mount"></div></div>
  <script>
(async()=>{
  const mount=document.getElementById("lunar-player-mount");
  try{
    const response=await fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"});
    const data=response.ok?await response.json():null;
    if(!data?.user||data.guest){mount.innerHTML='<section style="max-width:360px;padding:24px;border:1px solid #343b4a;border-radius:16px;background:#11151c;text-align:center"><h2>Spotify is for members</h2><p>Create an account or log in to use Spotify on Lunar.</p><a href="/account?mode=register" style="color:#b8a6ff">Create an account</a></section>';return;}
    const player=document.createElement("script");player.src="/assets/js/spotify-global-player.js?v=lunar2";document.body.appendChild(player);
  }catch{mount.textContent="Log in to use Spotify on Lunar.";}
})();
</script>
</body>
</html>
